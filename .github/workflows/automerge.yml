name: Automerge

# Enables GitHub native auto-merge on release-please and grouped non-major
# Dependabot PRs. Major dependency updates remain subject to normal review.
# Native auto-merge waits for required checks and then merge-commits without
# further action. This workflow does not check
# out PR code; pull_request_target is used only to enable auto-merge from
# the base workflow context.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    if: >
      startsWith(github.event.pull_request.head.ref, 'release-please--') ||
      (github.event.pull_request.user.login == 'dependabot[bot]' &&
        contains(github.event.pull_request.head.ref, '/non-major-'))
    steps:
      - name: Enable auto-merge (merge commit)
        env:
          GH_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --merge "$PR_URL"
