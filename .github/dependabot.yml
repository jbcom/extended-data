version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major"]
      non-major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: pip
    directory: /packages/extended-data
    schedule:
      interval: weekly
    groups:
      major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major"]
      non-major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: pip
    directory: /packages/pytest-extended-data
    schedule:
      interval: weekly
    groups:
      major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major"]
      non-major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major"]
      non-major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
