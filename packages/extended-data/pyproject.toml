[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "extended-data"
version = "8.4.3"
description = "Comprehensive Python data utilities for serialization, inputs, logging, and workflows"
requires-python = ">=3.11"
license = { text = "MIT" }
readme = "README.md"
keywords = [
    "data",
    "serialization",
    "configuration",
    "logging",
    "files",
    "workflows",
    "inputs",
]
authors = [{ name = "Jon Bogaty", email = "jon@jonbogaty.com" }]
maintainers = [{ name = "Jon Bogaty", email = "jon@jonbogaty.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "deepmerge>=2.0",
    "gitpython>=3.1.54",
    "inflection>=0.5.1",
    "num2words>=0.5.14",
    "orjson>=3.10.7",
    "python-hcl2>=4.3.4",
    "pyyaml>=6.0.1",
    "rich>=13.7.1",
    "ruamel.yaml>=0.18.0",
    "sortedcontainers>=2.4.0",
    "tomlkit>=0.13.2",
    "typing-extensions>=4.12.2",
    "validators>=0.22.0",
    "wrapt>=1.16.0",
]

[project.urls]
Documentation = "https://extended-data.dev"
Issues = "https://github.com/jbcom/extended-data/issues"
Source = "https://github.com/jbcom/extended-data"
Changelog = "https://github.com/jbcom/extended-data/blob/main/packages/extended-data/CHANGELOG.md"

[project.optional-dependencies]
tests = [
    "coverage[toml]>=7.6.0",
    "hypothesis>=6.100.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.6.1",
]
typing = [
    "mypy>=1.20.1",
    "sortedcontainers-stubs>=2.4.2",
    "types-PyYAML>=6.0.12.20240724",
]
dev = [
    "extended-data[tests,typing]",
    "ruff>=0.8.0",
]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=4.0.1,<6.0.0",
    "sphinx>=8.2.3,<10.0.0",
    "sphinx-autodoc2>=0.5.0",
    "sphinx-copybutton>=0.5.2",
]
all = []

[project.scripts]
extended-data = "extended_data.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/extended_data"]

[tool.ruff]
extend = "../../pyproject.toml"
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B018", "BLE", "D", "DTZ", "INP001", "LOG001", "N802", "N803", "PLC0415", "PT", "S", "SIM117", "TRY"]
"examples/**" = ["D", "EXE001", "INP001", "S110", "SIM105", "T201"]
